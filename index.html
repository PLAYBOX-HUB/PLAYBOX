<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayBox – Free Games</title>
<style>
:root{--bg:#fff7e8;--fg:#2a2118;--card:#fff;--cell:#eadfc9;--ac:#ff6b35;--ac2:#1f8a70;--bd:#e2d4b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1712;--fg:#f4ead8;--card:#2a241b;--cell:#3a3226;--bd:#3f3626}}
:root[data-theme="dark"]{--bg:#1b1712;--fg:#f4ead8;--card:#2a241b;--cell:#3a3226;--bd:#3f3626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font:800 34px/1 "Trebuchet MS",system-ui,sans-serif;margin:8px 0 4px;letter-spacing:-1px}
h1 span{color:var(--ac)}
.sub{margin:0 0 18px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.card:hover,.card:focus-visible{border-color:var(--ac);outline:none}
.card i{display:block;font-size:44px;font-style:normal}
.card b{display:block;margin-top:6px}
.card small{opacity:.7}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{margin:0;font-size:22px}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.b.g{background:var(--cell);color:var(--fg)}
#g{text-align:center}
.sc{font-size:18px;margin-bottom:8px;min-height:28px}
#app{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app button{touch-action:manipulation}
.pedal{flex:1;height:76px;font-size:20px;touch-action:none!important}
.h{opacity:.7;font-size:14px;margin:8px 0}
canvas{max-width:100%;border-radius:12px;touch-action:none}
.bd{display:grid;gap:6px;background:var(--bd);padding:6px;border-radius:14px;max-width:360px;margin:0 auto;touch-action:none}
#b2048{grid-template-columns:repeat(4,1fr)}
.t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--cell);font-weight:800;font-size:clamp(18px,6vw,28px);color:#3a2a14}
.cell{aspect-ratio:1;border:0;border-radius:8px;background:var(--cell);font-size:clamp(20px,7vw,32px);cursor:pointer;color:var(--fg);padding:0}
.cell.sel{outline:3px solid var(--ac);background:var(--card);animation:bob .5s infinite alternate}
@keyframes bob{to{transform:scale(1.12)}}
.cell.pop{animation:pop .3s forwards}
@keyframes pop{40%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.cell.drop{animation:drop .38s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-130%);opacity:.3}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.cell{animation:none!important}}
.cd.on{background:var(--card)}
.cd.ok{background:#bfe8c9}
</style></head><body>
<div class="w" id="app"></div>
<script>
const rnd=n=>Math.random()*n|0, wait=ms=>new Promise(r=>setTimeout(r,ms));
function ctl(t,cb){let sx,sy;
 t.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
 t.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;Math.abs(dx)>Math.abs(dy)?cb(dx>0?1:-1,0):cb(0,dy>0?1:-1)});
 const kd=e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();cb(...m)}};
 addEventListener('keydown',kd);return()=>removeEventListener('keydown',kd)}

function snake(el){
 el.innerHTML='<div class=sc>Score: <b id=s>0</b></div><canvas width=300 height=300></canvas><p class=h>Arrow keys or swipe</p><button class=b id=r>Restart</button> <button class="b g" id=w>Walls: On</button>';
 const c=el.querySelector('canvas'),x=c.getContext('2d'),S=el.querySelector('#s');
 let sn,d,nd,f,sc,over,wall=true;
 const hit=(p,q)=>p[0]==q[0]&&p[1]==q[1];
 function food(){do{f=[rnd(15),rnd(15)]}while(sn.some(p=>hit(p,f)))}
 function reset(){sn=[[7,7],[6,7],[5,7]];d=nd=[1,0];sc=0;over=0;S.textContent=0;food();draw()}
 function step(){if(over)return;d=nd;const h=[sn[0][0]+d[0],sn[0][1]+d[1]];
  if(!wall){h[0]=(h[0]+15)%15;h[1]=(h[1]+15)%15}if((wall&&(h[0]<0||h[1]<0||h[0]>14||h[1]>14))||sn.some(p=>hit(p,h))){over=1;return draw()}
  sn.unshift(h);if(hit(h,f)){S.textContent=++sc;food()}else sn.pop();draw()}
 function draw(){x.fillStyle='#1d2b24';x.fillRect(0,0,300,300);x.fillStyle='#ff5a5f';x.fillRect(f[0]*20+2,f[1]*20+2,16,16);x.fillStyle='#4ade80';sn.forEach(p=>x.fillRect(p[0]*20+1,p[1]*20+1,18,18));x.strokeStyle=wall?'#ff5a5f':'#2d4a3c';x.lineWidth=4;x.strokeRect(2,2,296,296);
  if(over){x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText('Game over',150,155)}}
 const off=ctl(c,(a,b)=>{if(!(a==-d[0]&&b==-d[1]))nd=[a,b]});
 const t=setInterval(step,130),W=el.querySelector('#w');W.onclick=()=>{wall=!wall;W.textContent='Walls: '+(wall?'On':'Off');reset()};
 el.querySelector('#r').onclick=reset;reset();
 return()=>{clearInterval(t);off()}}

function g2048(el){
 el.innerHTML='<div class=sc>Score: <b id=s>0</b></div><div class=bd id=b2048></div><p class=h>Arrow keys or swipe</p><button class=b id=r>Restart</button>';
 const B=el.querySelector('#b2048'),S=el.querySelector('#s');let g,sc;
 const add=()=>{const e=[];g.forEach((v,i)=>v||e.push(i));if(e.length)g[e[rnd(e.length)]]=Math.random()<.9?2:4};
 function draw(){S.textContent=sc;
  B.innerHTML=g.map(v=>`<div class=t${v?` style="background:hsl(${40-Math.log2(v)*3},85%,${78-Math.log2(v)*3}%)"`:''}>${v||''}</div>`).join('');
  const dead=!g.includes(0)&&!g.some((v,i)=>(i%4<3&&v==g[i+1])||(i<12&&v==g[i+4]));
  if(dead)S.textContent=sc+' – Game over'}
 function mv(dx,dy){let moved=0;
  for(let i=0;i<4;i++){
   const idx=[0,1,2,3].map(j=>dx?i*4+(dx>0?3-j:j):(dy>0?3-j:j)*4+i);
   const l=idx.map(k=>g[k]).filter(v=>v),o=[];
   for(let k=0;k<l.length;k++){if(l[k]==l[k+1]){o.push(l[k]*2);sc+=l[k]*2;k++}else o.push(l[k])}
   while(o.length<4)o.push(0);
   idx.forEach((k,j)=>{if(g[k]!=o[j]){moved=1;g[k]=o[j]}})}
  if(moved)add();draw()}
 function reset(){g=Array(16).fill(0);sc=0;add();add();draw()}
 const off=ctl(B,mv);el.querySelector('#r').onclick=reset;reset();return off}

function match3(el){
 const N=7,E=['🍎','🍊','🍋','🍇','🍓','🥝'];
 el.innerHTML='<div class=sc>Score: <b id=s>0</b></div><div class=bd id=b></div><p class=h>Swipe a fruit, or tap two neighbors, to swap. Match 3 or more.</p><button class=b id=r>Restart</button>';
 const B=el.querySelector('#b'),S=el.querySelector('#s');B.style.gridTemplateColumns='repeat(7,1fr)';
 let g,sel=null,sc=0,busy=0,dead=0,pop=new Set(),drop=null,ps=null;const rg=()=>E[rnd(6)];
 const adj=(a,i)=>Math.abs((a/N|0)-(i/N|0))+Math.abs(a%N-i%N)==1;
 const find=()=>{const m=new Set(),a=(...i)=>i.forEach(k=>m.add(k));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const i=r*N+c,v=g[i];if(!v)continue;
   if(c<N-2&&v==g[i+1]&&v==g[i+2])a(i,i+1,i+2);
   if(r<N-2&&v==g[i+N]&&v==g[i+2*N])a(i,i+N,i+2*N)}return m};
 function draw(){S.textContent=sc;B.innerHTML=g.map((v,i)=>{const r=i/N|0,c=i%N;let k='cell';
  if(i===sel)k+=' sel';if(pop.has(i))k+=' pop';if(drop&&r<=drop[c])k+=' drop';
  return `<button class="${k}" data-i=${i}>${v||''}</button>`}).join('')}
 async function res(){let m;while((m=find()).size){sc+=m.size*10;pop=m;draw();await wait(300);pop=new Set();
  drop=Array(N).fill(-1);m.forEach(i=>{const c=i%N,r=i/N|0;if(r>drop[c])drop[c]=r;g[i]=null});
  for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(g[r*N+c])col.push(g[r*N+c]);while(col.length<N)col.push(rg());for(let r=N-1;r>=0;r--)g[r*N+c]=col[N-1-r]}
  draw();await wait(380);drop=null}draw()}
 async function tryswap(a,i){busy=1;sel=null;draw();
  [g[a],g[i]]=[g[i],g[a]];const ok=find().size>0;[g[a],g[i]]=[g[i],g[a]];
  const ea=B.children[a],ei=B.children[i],w=ea.offsetWidth+6,dx=(i%N-a%N)*w,dy=((i/N|0)-(a/N|0))*w;
  ea.style.zIndex=2;ea.style.transition=ei.style.transition='transform .2s';
  ea.style.transform=`translate(${dx}px,${dy}px)`;ei.style.transform=`translate(${-dx}px,${-dy}px)`;
  await wait(220);if(dead)return;
  if(ok){[g[a],g[i]]=[g[i],g[a]];draw();await res()}
  else{ea.style.transform=ei.style.transform='';await wait(220);draw()}
  busy=0}
 function reset(){do{g=Array.from({length:N*N},rg)}while(find().size);sc=0;sel=null;draw()}
 B.onpointerdown=e=>{const i=+e.target.dataset.i;ps=isNaN(i)?null:{i,x:e.clientX,y:e.clientY}};
 B.onpointercancel=()=>{ps=null};
 B.onpointerup=e=>{if(!ps||busy||dead)return;const{i,x,y}=ps;ps=null;const dx=e.clientX-x,dy=e.clientY-y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){const h=Math.abs(dx)>Math.abs(dy),t=h?i+(dx>0?1:-1):i+(dy>0?N:-N);
   if(t>=0&&t<N*N&&(!h||(t/N|0)==(i/N|0)))tryswap(i,t);return}
  if(sel===null){sel=i;draw()}else if(sel==i){sel=null;draw()}else if(adj(sel,i))tryswap(sel,i);else{sel=i;draw()}};
 el.querySelector('#r').onclick=()=>{if(!busy)reset()};reset();return()=>{dead=1}}

function memory(el){
 const E=['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐙'];
 el.innerHTML='<div class=sc>Moves: <b id=s>0</b></div><div class=bd id=b></div><p class=h id=m>Find all 8 pairs.</p><button class=b id=r>Restart</button>';
 const B=el.querySelector('#b'),S=el.querySelector('#s'),M=el.querySelector('#m');B.style.gridTemplateColumns='repeat(4,1fr)';
 let cards,open,moves,done,lock,dead=0;
 function draw(){S.textContent=moves;B.innerHTML=cards.map((c,i)=>`<button class="cell cd${c.s==1?' on':''}${c.s==2?' ok':''}" data-i=${i}>${c.s?c.e:''}</button>`).join('')}
 function reset(){cards=[...E,...E].sort(()=>Math.random()-.5).map(e=>({e,s:0}));open=[];moves=0;done=0;lock=0;M.textContent='Find all 8 pairs.';draw()}
 B.onclick=e=>{const i=+e.target.dataset.i;if(lock||isNaN(i)||cards[i].s)return;
  cards[i].s=1;open.push(i);draw();
  if(open.length==2){moves++;lock=1;const[a,b]=open;
   setTimeout(()=>{if(dead)return;if(cards[a].e==cards[b].e){cards[a].s=cards[b].s=2;done++}else cards[a].s=cards[b].s=0;
    open=[];lock=0;draw();if(done==8)M.textContent='🎉 You won in '+moves+' moves!'},650)}};
 el.querySelector('#r').onclick=reset;reset();return()=>{dead=1}}

function ttt(el){
 el.innerHTML='<div class=sc id=m>Your turn (X)</div><div class=bd id=b></div><p class=h>You are X. The computer is O.</p><button class=b id=r>Restart</button>';
 const B=el.querySelector('#b'),M=el.querySelector('#m');B.style.gridTemplateColumns='repeat(3,1fr)';
 const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const win=b=>{for(const[a,c,d]of L)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return b[a];return b.includes('')?null:'T'};
 const mm=(b,p)=>{const w=win(b);if(w)return w=='O'?1:w=='X'?-1:0;let best=p=='O'?-2:2;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,s):Math.min(best,s)}return best};
 let g,over,dead=0;
 const draw=()=>{B.innerHTML=g.map((v,i)=>`<button class=cell data-i=${i}>${v}</button>`).join('')};
 function end(){const w=win(g);if(!w)return 0;over=1;M.textContent=w=='T'?"It's a draw!":w=='X'?'🎉 You win!':'Computer wins';return 1}
 function reset(){g=Array(9).fill('');over=0;M.textContent='Your turn (X)';draw()}
 B.onclick=async e=>{const i=+e.target.dataset.i;if(over||isNaN(i)||g[i])return;
  g[i]='X';draw();if(end())return;await wait(300);if(dead)return;
  const free=g.map((v,k)=>v?-1:k).filter(k=>k>=0);let pick;
  if(Math.random()<.25)pick=free[rnd(free.length)];
  else{let bs=-3;free.forEach(k=>{g[k]='O';const s=mm(g,'X');g[k]='';if(s>bs){bs=s;pick=k}})}
  g[pick]='O';draw();end()};
 el.querySelector('#r').onclick=reset;reset();return()=>{dead=1}}

function sal(el){
 const J={4:25,9:31,21:42,28:84,51:67,72:91,80:99,17:7,54:34,62:19,87:36,93:73,95:75,98:79};
 el.innerHTML='<div class=sc id=m>Your turn</div><div class=bd id=b></div><p class=h>🔵 You · 🔴 Computer. Green = ladder up, red = snake down.</p><button class=b id=d>🎲 Roll</button> <button class="b g" id=r>Restart</button>';
 const B=el.querySelector('#b'),M=el.querySelector('#m');B.style.gridTemplateColumns='repeat(10,minmax(0,1fr))';B.style.gap='2px';B.style.padding='2px';
 let p,turn,busy,over,dead=0;
 function draw(){let h='';for(let r=9;r>=0;r--)for(let c=0;c<10;c++){const n=r*10+(r%2?9-c:c)+1,j=J[n];
  h+=`<div class=t style="position:relative;overflow:hidden;min-width:0;font-size:9px;line-height:1.1;flex-direction:column;justify-content:flex-start;${j?'background:'+(j>n?'#bfe8c9':'#f6c1c1'):''}">${n}${j?`<br>${j>n?'↑':'↓'}${j}`:''}<span style="position:absolute;right:0;bottom:0;font-size:12px;line-height:1">${p[0]==n?'🔵':''}${p[1]==n?'🔴':''}</span></div>`}B.innerHTML=h}
 function reset(){p=[0,0];turn=0;busy=0;over=0;M.textContent='Your turn';draw()}
 async function go(){const t=turn,v=1+rnd(6);M.textContent=(t?'Computer':'You')+' rolled '+v;await wait(500);
  if(p[t]+v<=100)for(let k=0;k<v;k++){p[t]++;draw();await wait(170);if(dead)return}
  if(J[p[t]]){await wait(300);p[t]=J[p[t]];draw()}
  if(p[t]==100){M.textContent=t?'Computer wins!':'🎉 You win!';over=1;return}
  turn=1-t;M.textContent=turn?"Computer's turn":'Your turn';busy=0;
  if(turn){busy=1;await wait(700);if(!dead)go()}}
 el.querySelector('#d').onclick=()=>{if(busy||over)return;busy=1;go()};
 el.querySelector('#r').onclick=()=>{if(!busy||over)reset()};reset();return()=>{dead=1}}

function c4(el){
 el.innerHTML='<div class=sc id=m>Your turn 🔴</div><div class=bd id=b></div><p class=h>Tap a column to drop a disc. Connect 4 to win.</p><button class=b id=r>Restart</button>';
 const B=el.querySelector('#b'),M=el.querySelector('#m');B.style.gridTemplateColumns='repeat(7,1fr)';
 let g,over,dead=0;const E=['','🔴','🟡'];
 const row=c=>{for(let r=5;r>=0;r--)if(!g[r*7+c])return r;return-1};
 const won=p=>{for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[a,b]of[[0,1],[1,0],[1,1],[1,-1]]){let k=0;for(;k<4;k++){const y=r+a*k,x=c+b*k;if(y<0||y>5||x<0||x>6||g[y*7+x]!=p)break}if(k==4)return 1}return 0};
 const draw=()=>{B.innerHTML=g.map((v,i)=>`<button class=cell data-i=${i}>${E[v]}</button>`).join('')};
 function fin(p){if(won(p)){over=1;M.textContent=p==1?'🎉 You win!':'Computer wins';return 1}if(!g.includes(0)){over=1;M.textContent="It's a draw!";return 1}return 0}
 function ai(){const cs=[0,1,2,3,4,5,6].filter(c=>row(c)>=0);
  for(const p of[2,1])for(const c of cs){const i=row(c)*7+c;g[i]=p;const w=won(p);g[i]=0;if(w)return c}
  return cs.sort((a,b)=>Math.abs(a-3)+Math.random()*2-Math.abs(b-3)-Math.random()*2)[0]}
 B.onclick=async e=>{const i=+e.target.dataset.i;if(over||isNaN(i))return;const c=i%7,r=row(c);if(r<0)return;
  g[r*7+c]=1;draw();if(fin(1))return;M.textContent='Computer thinking…';await wait(400);if(dead)return;
  const k=ai();g[row(k)*7+k]=2;draw();if(!fin(2))M.textContent='Your turn 🔴'};
 const reset=()=>{g=Array(42).fill(0);over=0;M.textContent='Your turn 🔴';draw()};
 el.querySelector('#r').onclick=reset;reset();return()=>{dead=1}}

function sudoku(el){
 el.innerHTML='<div class=sc id=m>Pick a cell, then a number</div><div class=bd id=b></div><div id=p style="margin:8px"></div><button class=b id=r>New puzzle</button>';
 const B=el.querySelector('#b'),M=el.querySelector('#m'),P=el.querySelector('#p');B.style.gridTemplateColumns='repeat(9,1fr)';B.style.gap='1px';B.style.padding='2px';
 P.innerHTML=[1,2,3,4,5,6,7,8,9,'✖'].map(n=>`<button class="b g" style="margin:2px;padding:9px 11px" data-n=${n}>${n}</button>`).join('');
 let sol,g,fix,sel;const sh=a=>a.sort(()=>Math.random()-.5);
 function draw(){B.innerHTML=g.map((v,i)=>{const r=i/9|0,c=i%9,bad=v&&!fix[i]&&v!=sol[i];
  return `<button class=cell data-i=${i} style="font-size:clamp(14px,4.6vw,20px);border-radius:3px;background:${i==sel?'var(--ac)':((r/3|0)+(c/3|0))%2?'var(--cell)':'var(--card)'};font-weight:${fix[i]?800:500};color:${bad?'#e03131':fix[i]?'var(--fg)':'#1f8a70'}">${v||''}</button>`}).join('')}
 function reset(){const bd=sh([0,1,2]),rows=bd.flatMap(b=>sh([0,1,2]).map(x=>b*3+x)),cols=sh([0,1,2]).flatMap(b=>sh([0,1,2]).map(x=>b*3+x)),dg=sh([1,2,3,4,5,6,7,8,9]);
  sol=[];rows.forEach(r=>cols.forEach(c=>sol.push(dg[(r*3+(r/3|0)+c)%9])));
  g=sol.map(v=>Math.random()<.45?v:0);fix=g.map(v=>v>0);sel=-1;M.textContent='Pick a cell, then a number';draw()}
 B.onclick=e=>{const i=+e.target.dataset.i;if(isNaN(i)||fix[i])return;sel=i;draw()};
 P.onclick=e=>{const n=e.target.dataset.n;if(n===undefined||sel<0)return;g[sel]=n=='✖'?0:+n;draw();
  if(g.every((v,i)=>v==sol[i]))M.textContent='🎉 Solved!'};

function hill(el){

function shooter(el){

 const c=el.querySelector('canvas'),x=c.getContext('2d'),L=el.querySelector('#l'),S=el.querySelector('#s'),Bs=el.querySelector('#b'),M=el.querySelector('#m');
 const W=320,H=400,SY=H-40;
 let sx,bul,en,pt,lives,sc,t,over,best=0,kl=0,kr=0,hurt=0;
 const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 function reset(){sx=W/2;bul=[];en=[];pt=[];lives=3;sc=0;t=0;over=0;hurt=0;M.textContent='Drag to move your ship. It fires automatically.'}
 function boom(a,b){for(let i=0;i<8;i++)pt.push({x:a,y:b,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:18})}
 function lose(){lives--;hurt=12;if(lives<=0){over=1;best=Math.max(best,sc);Bs.textContent=best;M.textContent='Game over! Score '+sc+'. Press Restart.'}}
 function tick(){
  if(!over){t++;sx=cl(sx+(kr-kl)*5,16,W-16);if(t%10==0)bul.push({x:sx,y:SY-16});
   if(t%Math.max(16,50-(sc/8|0))==0)en.push({x:20+rnd(280),y:-20,vy:1.2+Math.min(2.2,sc/150)+Math.random()*.6,ph:rnd(6),hp:sc>120&&rnd(4)==0?2:1});
   for(const b of bul)b.y-=7;bul=bul.filter(b=>b.y>-10);
   for(const e of en){e.y+=e.vy;e.x=cl(e.x+Math.sin((t+e.ph*30)/20)*.8,14,W-14);
    for(const b of bul){if(b.y<0)continue;if(Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<16){b.y=-99;e.hp--;if(e.hp<=0){sc+=10;boom(e.x,e.y);e.dead=1;break}}}
    if(!e.dead&&Math.abs(e.x-sx)<18&&Math.abs(e.y-SY)<20){e.dead=1;boom(e.x,e.y);lose()}
    else if(!e.dead&&e.y>H+10){e.dead=1;lose()}}
   en=en.filter(e=>!e.dead);bul=bul.filter(b=>b.y>-50)}
  for(const p of pt){p.x+=p.vx;p.y+=p.vy;p.l--}pt=pt.filter(p=>p.l>0);if(hurt>0)hurt--;
  x.fillStyle='#070b1f';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(let k=0;k<40;k++){x.fillRect((k*97)%W,((k*53+t*(1+k%3))%H),1+k%2,1+k%2)}

  for(const p of pt){x.fillStyle=`rgba(255,${120+p.l*6},60,${p.l/18})`;x.fillRect(p.x,p.y,4,4)}
  if(!over){x.fillStyle=hurt%4<2?'#4cc9f0':'#ff6b6b';x.beginPath();x.moveTo(sx,SY-18);x.lineTo(sx+16,SY+14);x.lineTo(sx,SY+7);x.lineTo(sx-16,SY+14);x.fill();
   x.fillStyle='#ff9f1c';x.beginPath();x.moveTo(sx-5,SY+9);x.lineTo(sx,SY+14+Math.random()*8);x.lineTo(sx+5,SY+9);x.fill()}
  L.textContent=Math.max(0,lives);S.textContent=sc}
 const setp=e=>{const r=c.getBoundingClientRect();sx=cl((e.clientX-r.left)/r.width*W,16,W-16)};
 c.onpointermove=setp;c.onpointerdown=setp;
 const kd=e=>{if(e.key=='ArrowLeft')kl=1;else if(e.key=='ArrowRight')kr=1;else return;e.preventDefault()},ku=e=>{if(e.key=='ArrowLeft')kl=0;if(e.key=='ArrowRight')kr=0};
 addEventListener('keydown',kd);addEventListener('keyup',ku);
 el.querySelector('#r').onclick=reset;reset();const iv=setInterval(tick,16);
 return{tick,get st(){return{lives,sc,over,en:en.length,bul:bul.length}},setx:v=>{sx=v},stop:()=>{clearInterval(iv);removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}}
